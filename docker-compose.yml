services:
  golang:
    build:
      context: ./golang
      dockerfile: Dockerfile
    image: incremental-golang-api:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      RATE_LIMIT_RPS: "5"
      RATE_LIMIT_BURST: "20"
      NODEJS_URL: "http://nodejs:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  nodejs:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    image: incremental-nodejs-api:local
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      RATE_LIMIT_RPS: "5"
      RATE_LIMIT_BURST: "20"
      GOLANG_URL: "http://golang:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
